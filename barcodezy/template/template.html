<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container {
            position: relative;
            /* Ensure container is relatively positioned */
            padding-top: 30px;
            /* Add top padding to create space for the icon */
        }

        .svg-icon {
            position: absolute;
            top: 10px;
            /* Adjust as needed */
            left: 10px;
            /* Adjust as needed */
            width: 58px;
            /* Size of the icon */
            height: 50px;
            /* Size of the icon */
        }
    </style>
</head>

    <div class="jumbotron">
        <div class="container">
            <h1>{{ title }}</h1>
            <p class="lead">{{ subtitle }}</p>
        </div>
    </div>

    <div class="container">

        <section class="mt-4">
            <h2>Alignment summary</h2>
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="thead-light">
                        <tr>
                            {% for header in headers %}
                            <th>{{ header }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in data %}
                        <tr>
                            {% for item in row %}
                            <td>{{ item }}</td>
                            {% endfor %}
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>

        <section class="mt-4">
            <h2>Read length distribution</h2>
            <div>
                <img src="data:image/png;base64,{{ img_base64 }}" alt="Plot Image" class="img-fluid float-left" />
            </div>
        </section>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
