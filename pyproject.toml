[build-system]
requires = [
    "setuptools"
]

[project]
name = "LongBarcodeQC"
version = "1.0.0"
description = "Analyze long-read barcodes and generate a summary report"
authors = [
    {name="Zach Goode", email="goodez@ohsu.edu"}
]
requires-python = ">=3.10"
dependencies = [
    "pandas >= 2.1.1",
    "parasail >= 1.3.4",
    "matplotlib >= 3.8.4",
    "jinja2 >= 3.1.4",
    "seaborn >= 0.13.2",
    "pyarrow >= 14.0",
    "tqdm >= 4.66"
]

readme = "README.md"

[project.urls]
repository = "https://github.com/barcodezy/LongBarcodeQC"

[tool.setuptools]
packages = ["longbarcodeqc"]

[project.scripts]
LongBarcodeQC = "longbarcodeqc.main:main"

[tool.setuptools.package-data]
"longbarcodeqc" = ["plasmids/**", "template/**"]
